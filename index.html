<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Filafinder - What 3D Printer Filament Do You Need?</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="icon" href="filafinder-icon.ico" type="image/x-icon">
</head>
<body class="bg-zinc-900 text-zinc-100 min-h-screen flex flex-col items-center justify-center p-6 md:p-10">

    <div class="max-w-2xl w-full bg-zinc-800/90 rounded-2xl shadow-2xl p-8 md:p-12 border border-zinc-700 backdrop-blur-md">
        <!-- Header -->
        <div class="text-center mb-10">
            <h1 class="text-3xl md:text-5xl font-extrabold text-teal-400 tracking-tight">Filafinder</h1>
            <p class="text-zinc-400 text-base md:text-lg mt-3">Find the right filament for your 3D printer parts based on strength, temperature, and hardware.</p>
        </div>

        <!-- Progress Bar -->
        <div class="w-full bg-zinc-700 h-3 rounded-full mb-8 overflow-hidden">
            <div id="progress-bar" class="bg-pink-500 h-full transition-all duration-300" style="width: 20%;"></div>
        </div>

        <!-- Question Container -->
        <div id="quiz-container">
            <h2 id="question-text" class="text-xl md:text-2xl font-semibold mb-6 text-zinc-200"></h2>
            <div id="options-container" class="space-y-4">
                <!-- Dynamically injected options -->
            </div>
        </div>

        <!-- Restart Button (Hidden initially) -->
        <div id="restart-container" class="hidden text-center mt-8">
            <button onclick="startQuiz()" class="bg-pink-600 hover:bg-pink-500 text-white font-bold text-lg px-8 py-3 rounded-xl transition-colors shadow-lg hover:shadow-pink-500/25">
                Start Over
            </button>
        </div>
    </div>

    <script>
        const questions = [
            {
                id: 'primary_goal',
                question: 'What kind of project or part are you printing?',
                options: [
                    { text: 'Aesthetics / Visual Display Models', next: 'aesthetic_type' },
                    { text: 'Functional 3D Printer Parts & Mechanical Components', next: 'printer_part_temp' },
                    { text: 'Flexibility, Bending, or Living Hinges', next: 'flex_type' }
                ]
            },
            // --- AESTHETICS BRANCH ---
            {
                id: 'aesthetic_type',
                question: 'What kind of surface finish are you looking for?',
                options: [
                    { text: 'High gloss, metallic sheen, or silky luster', result: 'SILK_PLA' },
                    { text: 'Smooth, non-reflective matte texture', result: 'MATTE_PLA' },
                    { text: 'Standard clean look', result: 'PLA' }
                ]
            },
            // --- FLEXIBILITY BRANCH ---
            {
                id: 'flex_type',
                question: 'What kind of flexibility do you need?',
                options: [
                    { text: 'Flexible & rubber-like (Gaskets, feet, phone cases)', result: 'TPU' },
                    { text: 'Semi-rigid with extreme fatigue resistance (Living hinges)', result: 'PP' }
                ]
            },
            // --- PRINTER PARTS BRANCH ---
            {
                id: 'printer_part_temp',
                question: 'What temperature resistance and printer setup do you have for your functional part?',
                options: [
                    { text: 'Low temperature resistance is fine (Easy printing, high structural rigidity)', next: 'pla_or_cf' },
                    { text: 'Medium temperature resistance (Easy printing, good toughness)', next: 'petg_or_cf' },
                    { text: 'High temperature resistance (Requires an enclosed printer)', next: 'abs_asa_branch' }
                ]
            },
            {
                id: 'pla_or_cf',
                question: 'Do you want maximum strength/rigidity with a fiber-reinforced version (requires hardened nozzle)?',
                options: [
                    { text: 'Yes, give me CF/GF-reinforced PLA (Hardened nozzle ready)', result: 'CF_PLA' },
                    { text: 'No, standard easy-to-print PLA is fine (Standard brass nozzle)', result: 'PLA' }
                ]
            },
            {
                id: 'petg_or_cf',
                question: 'Do you want enhanced rigidity with a carbon/glass fiber reinforced PETG (requires hardened nozzle)?',
                options: [
                    { text: 'Yes, CF-PETG for extra stiffness and toughness', result: 'CF_PETG' },
                    { text: 'No, standard easy-to-print PETG is fine', result: 'PETG' }
                ]
            },
            {
                id: 'abs_asa_branch',
                question: 'What are your specific environmental and hardware requirements for high-temp parts?',
                options: [
                    { text: 'Standard high-temp mechanical part (Enclosed printer required)', next: 'abs_asa_choice' },
                    { text: 'Extreme industrial load or max stiffness with fiber reinforcement (Hardened nozzle + Enclosure)', result: 'CF_ASA_PC' }
                ]
            },
            {
                id: 'abs_asa_choice',
                question: 'Will the part be used indoors or outdoors under UV exposure?',
                options: [
                    { text: 'Indoor mechanical / general high-temp part (ABS)', result: 'ABS' },
                    { text: 'Outdoor part exposed to sunlight and weather (ASA)', result: 'ASA' }
                ]
            },
            {
                id: 'CF_ASA_PC',
                question: 'Choose your high-end engineering material:',
                options: [
                    { text: 'CF-ASA (Enclosure + Hardened nozzle for outdoor high-strength parts)', result: 'CF_ASA' },
                    { text: 'Polycarbonate / PC (Extreme heat & industrial load, fully enclosed)', result: 'PC' }
                ]
            }
        ];

        const filamentData = {
            'PLA': {
                title: 'PLA (Standard)',
                desc: 'The easiest filament to print with excellent dimensional accuracy and high initial strength/rigidity, but low temperature resistance (softens around 50–60°C).',
                bestFor: 'Dry indoor printer parts, brackets, easy prototypes.',
                settings: 'Nozzle: 190–210°C | Bed: 50–60°C | Enclosure: Not needed'
            },
            'CF_PLA': {
                title: 'CF-Reinforced PLA',
                desc: 'Standard PLA infused with carbon fiber for increased structural rigidity, reduced warping, and a gorgeous matte textured finish. Requires a hardened nozzle.',
                bestFor: 'Stiff mechanical brackets, non-heated internal printer parts.',
                settings: 'Nozzle: 200–220°C (Hardened) | Bed: 50–60°C | Enclosure: Not needed'
            },
            'SILK_PLA': {
                title: 'Silk PLA',
                desc: 'Blended with additives to yield a high-gloss, reflective, shiny finish that brilliantly masks layer lines.',
                bestFor: 'Display art, cosmetic models, statues.',
                settings: 'Nozzle: 200–220°C | Bed: 50–60°C | Enclosure: Not needed'
            },
            'MATTE_PLA': {
                title: 'Matte PLA',
                desc: 'Formulated to eliminate plastic shine, resulting in a smooth, flat stone or paper-like texture.',
                bestFor: 'Architectural models, modern aesthetic displays.',
                settings: 'Nozzle: 200–215°C | Bed: 50–60°C | Enclosure: Not needed'
            },
            'PETG': {
                title: 'PETG',
                desc: 'A tough, dependable workhorse offering easy printing, medium temperature resistance, and great layer adhesion.',
                bestFor: 'General mechanical parts, functional clips, water-resistant utility.',
                settings: 'Nozzle: 230–250°C | Bed: 70–80°C | Enclosure: Not needed'
            },
            'CF_PETG': {
                title: 'CF-Reinforced PETG',
                desc: 'PETG infused with carbon fiber for higher rigidity and a matte finish while maintaining PETG toughness. Requires a hardened nozzle.',
                bestFor: 'Stiff structural brackets, high-performance functional prints.',
                settings: 'Nozzle: 240–260°C (Hardened) | Bed: 70–85°C | Enclosure: Not needed'
            },
            'ABS': {
                title: 'ABS',
                desc: 'Provides high impact resistance and elevated temperature resistance, but strictly requires a heated, enclosed printer and proper ventilation.',
                bestFor: 'Indoor functional engineering parts, high-heat items.',
                settings: 'Nozzle: 240–260°C | Bed: 90–110°C | Enclosure: Required'
            },
            'ASA': {
                title: 'ASA',
                desc: 'Mechanically similar to ABS with high temperature resistance, but adds superior UV and weather resistance for outdoor use. Requires an enclosure.',
                bestFor: 'Outdoor printer parts, automotive trim, weather-exposed housings.',
                settings: 'Nozzle: 240–260°C | Bed: 90–100°C | Enclosure: Required'
            },
            'CF_ASA': {
                title: 'CF-Reinforced ASA',
                desc: 'Combines the ultimate outdoor UV stability of ASA with chopped carbon fiber for extreme rigidity. Requires an enclosure and hardened nozzle.',
                bestFor: 'High-stress outdoor drone frames, structural mechanical enclosures.',
                settings: 'Nozzle: 250–270°C (Hardened) | Bed: 95–110°C | Enclosure: Required'
            },
            'PC': {
                title: 'PC (Polycarbonate)',
                desc: 'An extreme engineering thermoplastic boasting massive impact strength, high rigidity, and thermal stability up to 110–140°C.',
                bestFor: 'Heavy-load industrial components, high-heat enclosures.',
                settings: 'Nozzle: 260–310°C | Bed: 110–135°C | Enclosure: Fully Enclosed & Vented'
            },
            'TPU': {
                title: 'TPU',
                desc: 'A flexible, highly elastic elastomer with exceptional impact absorption and tear resistance.',
                bestFor: 'Dampening feet, flexible joints, protective cases.',
                settings: 'Nozzle: 210–230°C | Bed: 30–60°C | Print Slow'
            },
            'PP': {
                title: 'PP (Polypropylene)',
                desc: 'Ultra-lightweight with incredible fatigue resistance, perfect for parts that bend repeatedly.',
                bestFor: 'Living hinges, snap-fit functional containers.',
                settings: 'Nozzle: 220–250°C | Bed: 85–100°C (Special tape required)'
            }
        };

        let currentStep = 'primary_goal';
        let historyStack = [];

        function startQuiz() {
            currentStep = 'primary_goal';
            historyStack = [];
            document.getElementById('quiz-container').style.display = 'block';
            document.getElementById('restart-container').classList.add('hidden');
            renderQuestion();
        }

        function renderQuestion() {
            const questionObj = questions.find(q => q.id === currentStep);
            document.getElementById('question-text').innerText = questionObj.question;
            
            const optionsContainer = document.getElementById('options-container');
            optionsContainer.innerHTML = '';

            questionObj.options.forEach(opt => {
                const button = document.createElement('button');
                button.className = 'w-full text-left bg-zinc-700/80 hover:bg-teal-600 hover:text-white p-5 rounded-xl transition-all duration-200 border border-zinc-600 font-medium text-base md:text-lg shadow-md';
                button.innerText = opt.text;
                
                button.onclick = () => {
                    historyStack.push(currentStep);
                    if (opt.result) {
                        renderResult(opt.result);
                    } else {
                        currentStep = opt.next;
                        updateProgress();
                        renderQuestion();
                    }
                };
                optionsContainer.appendChild(button);
            });
            updateProgress();
        }

        function renderResult(filamentKey) {
            const data = filamentData[filamentKey] || {
                title: filamentKey,
                desc: 'Recommended material based on your configuration.',
                bestFor: 'Targeted application use',
                settings: 'Check roll specifications'
            };

            document.getElementById('quiz-container').innerHTML = `
                <div class="text-center py-2">
                    <span class="text-xs uppercase tracking-wider bg-teal-950 text-teal-300 border border-teal-800 px-4 py-1.5 rounded-full font-bold">Optimal Choice</span>
                    <h2 class="text-3xl font-extrabold text-teal-400 mt-4 mb-3">${data.title}</h2>
                    <p class="text-zinc-300 text-base md:text-lg mb-6 leading-relaxed">${data.desc}</p>
                    
                    <div class="bg-zinc-900/80 p-5 rounded-xl text-left mb-6 border border-zinc-700 space-y-3 shadow-inner">
                        <p class="text-sm"><strong class="text-pink-400">Best For:</strong> ${data.bestFor}</p>
                        <p class="text-sm"><strong class="text-pink-400">Typical Settings:</strong> ${data.settings}</p>
                    </div>
                </div>
            `;
            document.getElementById('progress-bar').style.width = '100%';
            document.getElementById('restart-container').classList.remove('hidden');
        }

        function updateProgress() {
            const stepsTotal = 5;
            const currentLevel = historyStack.length + 1;
            const percentage = Math.min((currentLevel / stepsTotal) * 100, 100);
            document.getElementById('progress-bar').style.width = percentage + '%';
        }

        // Initialize on load
        startQuiz();
    </script>
</body>
</html>
